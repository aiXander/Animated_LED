name: pulse_mono
summary: Solid colour following one audio band, with a beat punch and a slow breath
  in silence. The safe-idle effect.
source: bundled
created_at: 0
updated_at: 1794847816.548617
params:
- key: color
  label: Colour
  control: color
  default: '#ff5566'
- key: floor
  label: Brightness floor
  help: Brightness when the music is silent; the band fills the rest.
  control: slider
  min: 0.0
  max: 1.0
  step: 0.01
  default: 0.4
- key: audio_band
  label: Brightness driver
  help: Which audio band drives the brightness.
  control: select
  options:
  - low
  - mid
  - high
  default: low
- key: beat_punch
  label: Beat punch
  help: Extra flash on every beat, decaying over a quarter second.
  control: slider
  min: 0.0
  max: 1.0
  step: 0.01
  default: 0.3
- key: breath
  label: Idle breath
  help: Depth of the slow breath that takes over when the band is quiet.
  control: slider
  min: 0.0
  max: 1.0
  step: 0.01
  default: 0.3
param_values:
  color: '#ff5566'
  floor: 0.4
  audio_band: low
  beat_punch: 0.3
  breath: 0.3
