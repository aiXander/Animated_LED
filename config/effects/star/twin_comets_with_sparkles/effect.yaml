name: twin_comets_with_sparkles
summary: Two comets, each its own colour, running out along a leg and on to the next,
  shedding fading sparkle trails; kicks throw a sparkle burst around each head.
source: bundled
created_at: 0
updated_at: 1794855910.941014
params:
- key: leader_color
  label: Leader colour
  control: color
  default: '#ff2020'
- key: follower_color
  label: Follower colour
  control: color
  default: '#1040ff'
- key: lead_offset
  label: Lead
  help: How far the follower trails the leader (fraction of a leg).
  control: slider
  min: 0.0
  max: 0.9
  step: 0.01
  default: 0.22
- key: speed
  label: Comet speed
  help: Legs run per second.
  control: slider
  min: 0.02
  max: 2.0
  step: 0.01
  default: 0.12
  unit: legs/s
- key: sparkle_decay
  label: Sparkle fade time
  control: slider
  min: 0.1
  max: 5.0
  step: 0.05
  default: 3.0
  unit: s
- key: sparkle_density
  label: Sparkle density
  help: Share of LEDs behind each head that light up as sparkles; also sets the size
    of the burst on each kick. 0 = no sparkles.
  control: slider
  min: 0.0
  max: 1.0
  step: 0.01
  default: 0.25
- key: head_size
  label: Comet head size
  help: Width of the glowing head (fraction of a leg).
  control: slider
  min: 0.005
  max: 0.2
  step: 0.005
  default: 0.06
- key: audio_band
  label: Head brightness driver
  help: Which audio band drives the brightness.
  control: select
  options:
  - low
  - mid
  - high
  default: mid
param_values:
  leader_color: '#ff2020'
  follower_color: '#1040ff'
  lead_offset: 0.22
  speed: 0.12
  sparkle_decay: 3.0
  sparkle_density: 0.25
  head_size: 0.06
  audio_band: mid
