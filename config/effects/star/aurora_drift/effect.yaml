name: aurora_drift
summary: Curtains of light drifting along the legs where two slow waves meet, each
  leg out of step, colours wandering through the palette.
source: agent
created_at: 1794853542.926852
updated_at: 1794854186.786551
params:
- key: palette
  label: Palette
  control: palette
  default: aurora
- key: speed
  label: Speed
  help: How fast the curtains drift.
  control: slider
  min: 0.0
  max: 4.0
  step: 0.05
  default: 1.0
- key: band_scale
  label: Band scale
  help: Higher = more, narrower bands on each leg.
  control: slider
  min: 0.3
  max: 3.0
  step: 0.05
  default: 0.7
- key: floor
  label: Brightness floor
  help: Brightness between the bands.
  control: slider
  min: 0.0
  max: 1.0
  step: 0.01
  default: 0.05
- key: peak
  label: Brightness peak
  help: Brightness in the middle of a band.
  control: slider
  min: 0.0
  max: 1.0
  step: 0.01
  default: 0.8
- key: colour_spread
  label: Colour spread
  help: How much the colour differs along a leg and between legs.
  control: slider
  min: 0.0
  max: 3.0
  step: 0.01
  default: 1.0
- key: shimmer
  label: Treble shimmer
  help: How much treble brightens the bands.
  control: slider
  min: 0.0
  max: 1.0
  step: 0.01
  default: 0.3
param_values:
  palette: aurora
  speed: 1.0
  band_scale: 0.7
  floor: 0.05
  peak: 0.8
  colour_spread: 1.0
  shimmer: 0.3
