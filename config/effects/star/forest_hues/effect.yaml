name: forest_hues
summary: Three interfering wave layers in forest greens along the legs; bass lifts
  the brightness and each beat sends a soft ring out from the hub.
source: agent
created_at: 1779526616.022725
updated_at: 1794855910.941014
params:
- key: palette
  label: Palette
  control: palette
  default: forest
- key: flow_speed
  label: Flow speed
  help: How fast all three wave layers move.
  control: slider
  min: 0.1
  max: 10.0
  step: 0.1
  default: 0.3
- key: base_intensity
  label: Base intensity
  help: Brightness with no bass.
  control: slider
  min: 0.0
  max: 1.0
  step: 0.05
  default: 0.8
- key: contrast
  label: Contrast
  help: Stretches the waves over more of the palette; high values reach its darkest
    and brightest ends.
  control: slider
  min: 0.5
  max: 3.0
  step: 0.05
  default: 1.5
- key: detail
  label: Detail
  help: Strength of the ripples and rings over the slow swell. 0 = slow swell only.
  control: slider
  min: 0.0
  max: 2.0
  step: 0.05
  default: 1.0
- key: bass_boost
  label: Bass boost
  help: Extra brightness added by the bass.
  control: slider
  min: 0.0
  max: 1.0
  step: 0.05
  default: 0.3
- key: beat_ripple
  label: Beat ring
  help: Brightness of the soft ring each beat sends out from the hub. 0 = off.
  control: slider
  min: 0.0
  max: 1.5
  step: 0.05
  default: 0.4
param_values:
  palette: forest
  flow_speed: 0.3
  base_intensity: 0.8
  contrast: 1.5
  detail: 1.0
  bass_boost: 0.3
  beat_ripple: 0.4
