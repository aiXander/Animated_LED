name: twin_comets_with_sparkles
summary: Two comets (one per row, each its own colour) shedding fading sparkle trails;
  kicks throw a sparkle burst around each head.
source: agent
created_at: 1778423862.085811
updated_at: 1794847816.548617
params:
- key: leader_color
  label: Top comet colour
  control: color
  default: '#ff2020'
- key: follower_color
  label: Bottom comet colour
  control: color
  default: '#1040ff'
- key: lead_offset
  label: "Top\u2013bottom lead"
  help: How far the bottom comet trails the top one (fraction of the rig width).
  control: slider
  min: 0.0
  max: 0.5
  step: 0.01
  default: 0.1667
- key: speed
  label: Comet speed
  help: Rig crossings per second.
  control: slider
  min: 0.05
  max: 2.0
  step: 0.01
  default: 0.4
  unit: cycles/s
- key: sparkle_decay
  label: Sparkle fade time
  control: slider
  min: 0.1
  max: 5.0
  step: 0.05
  default: 1.5
  unit: s
- key: sparkle_density
  label: Sparkle density
  help: Share of LEDs behind each head that light up as sparkles; also sets the size
    of the burst on each kick. 0 = no sparkles.
  control: slider
  min: 0.0
  max: 1.0
  step: 0.01
  default: 0.25
- key: head_size
  label: Comet head size
  help: Width of the glowing head (fraction of the rig width).
  control: slider
  min: 0.005
  max: 0.1
  step: 0.001
  default: 0.03
- key: audio_band
  label: Head brightness driver
  help: Which audio band drives the brightness.
  control: select
  options:
  - low
  - mid
  - high
  default: low
param_values:
  leader_color: '#ff2020'
  follower_color: '#1040ff'
  lead_offset: 0.22
  speed: 0.49
  sparkle_decay: 0.7
  sparkle_density: 0.25
  head_size: 0.1
  audio_band: mid
