name: center_color_comets
summary: Comets shooting from the centre out along all four strips, trailing palette
  colour; beats throw them forward.
source: agent
created_at: 1778423397.188693
updated_at: 1794847816.548617
params:
- key: speed
  label: Speed
  help: 1 = a comet crosses a half-rig in two seconds.
  control: slider
  min: 0.0
  max: 10.0
  step: 0.05
  default: 1.0
- key: comets
  label: Comets per strip
  control: int_slider
  min: 1
  max: 6
  step: 1
  default: 1
- key: trail_length
  label: Trail persistence
  help: Higher = longer, slower-fading trails.
  control: slider
  min: 0.1
  max: 3.0
  step: 0.05
  default: 1.0
- key: direction
  label: Direction
  control: select
  options:
  - Outward
  - Inward
  default: Outward
- key: palette
  label: Palette
  control: palette
  default: rainbow
- key: color_spread
  label: Colour spread
  help: How much of the palette is spread across the rig at once.
  control: slider
  min: 0.0
  max: 2.0
  step: 0.01
  default: 0.5
- key: bass_pulse
  label: Bass pulse
  help: How far the brightness dips between bass hits. 0 = steady.
  control: slider
  min: 0.0
  max: 1.0
  step: 0.01
  default: 0.4
- key: beat_surge
  label: Beat surge
  help: How hard each beat throws the comets forward. 0 = steady motion.
  control: slider
  min: 0.0
  max: 6.0
  step: 0.1
  default: 1.5
param_values:
  speed: 0.7
  comets: 1
  trail_length: 2.0
  direction: Outward
  palette: rainbow
  color_spread: 0.5
  bass_pulse: 0.4
  beat_surge: 1.5
