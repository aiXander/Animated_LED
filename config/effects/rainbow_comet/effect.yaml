name: rainbow_comet
summary: Rainbow comets circling the rig; bass lifts the brightness and each beat
  jumps the rainbow along the colour wheel.
source: agent
created_at: 1778352980.7684128
updated_at: 1794847816.548617
params:
- key: direction
  label: Direction
  control: select
  options:
  - Clockwise
  - Counter-Clockwise
  default: Clockwise
- key: speed
  label: Speed
  help: Laps of the rig per second.
  control: slider
  min: 0.02
  max: 2.0
  step: 0.01
  default: 0.5
  unit: laps/s
- key: comets
  label: Comets
  help: Evenly spaced around the rig.
  control: int_slider
  min: 1
  max: 6
  step: 1
  default: 1
- key: tail_length
  label: Tail length
  help: Tail as a fraction of the gap to the next comet.
  control: slider
  min: 0.1
  max: 1.0
  step: 0.01
  default: 0.5
- key: rainbow_stretch
  label: Rainbow stretch
  help: Times the colour wheel repeats around the rig.
  control: slider
  min: 0.1
  max: 5.0
  step: 0.01
  default: 1.0
- key: base_brightness
  label: Base brightness
  help: Brightness when the music is silent; bass fills the rest.
  control: slider
  min: 0.0
  max: 1.0
  step: 0.01
  default: 0.35
- key: beat_hue_shift
  label: Beat hue shift
  help: How far each beat jumps the colours along the wheel. 0 = off.
  control: slider
  min: 0.0
  max: 0.5
  step: 0.01
  default: 0.06
param_values:
  direction: Clockwise
  speed: 0.12
  comets: 1
  tail_length: 0.8
  rainbow_stretch: 0.57
  base_brightness: 0.5
  beat_hue_shift: 0.06
