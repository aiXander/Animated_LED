project:
  name: festival_scaffold_dev
  target_fps: 60
server:
  host: 127.0.0.1
  port: 8000
controllers:
  gledopto_main:
    type: wled-ddp
    host: 127.0.0.1
    port: 4048
    pixel_count: 1800
strips:
- id: top_left
  controller: gledopto_main
  output: 1
  pixel_offset: 0
  pixel_count: 450
  leds_per_meter: 30.0
  geometry:
    type: line
    start:
    - 0.0
    - 0.5
    - 0.0
    end:
    - -15.0
    - 0.5
    - 0.0
  reversed: false
- id: top_right
  controller: gledopto_main
  output: 2
  pixel_offset: 450
  pixel_count: 450
  leds_per_meter: 30.0
  geometry:
    type: line
    start:
    - 0.0
    - 0.5
    - 0.0
    end:
    - 15.0
    - 0.5
    - 0.0
  reversed: false
- id: bottom_left
  controller: gledopto_main
  output: 3
  pixel_offset: 900
  pixel_count: 450
  leds_per_meter: 30.0
  geometry:
    type: line
    start:
    - 0.0
    - -0.5
    - 0.0
    end:
    - -15.0
    - -0.5
    - 0.0
  reversed: false
- id: bottom_right
  controller: gledopto_main
  output: 4
  pixel_offset: 1350
  pixel_count: 450
  leds_per_meter: 30.0
  geometry:
    type: line
    start:
    - 0.0
    - -0.5
    - 0.0
    end:
    - 15.0
    - -0.5
    - 0.0
  reversed: false
transport:
  mode: simulator
  sim:
    ws_path: /ws/frames
output:
  gamma: 1.5
  lut_size: 256
audio_server:
  # External audio-feature server (Realtime_PyAudio_FFT). On boot ledctl
  # spawns the `audio-server` console script and listens for /audio/lmh on
  # OSC. Pick the input device, retune bands, save presets at the audio
  # server's UI (default http://127.0.0.1:8766) — there is no LED-side mic
  # config any more. If the subprocess fails or the OSC stream stops, the
  # render loop keeps running with audio_band returning 0 + a warning in
  # this terminal.
  enabled: true
  autostart: true
  # The Rust server (the audio repo's `rust-engine` branch, the default).
  # Build it first: `cargo build --release -p server` in that repo's engine/
  # (WZRD's app runs the same build on boot). Absolute paths pass through the
  # bridge untouched. Don't go back to a bare `python -m server.main`: that
  # means ledctl's interpreter, whose venv lacks sounddevice (`uv run`
  # re-syncs it to this repo's lockfile and removes hand-installed packages).
  command: ["/Users/xandersteenbrugge/Documents/GitHub/Realtime_PyAudio_FFT/engine/target/release/audio-server"]
  # The audio-server reads + writes its own config.yaml next to its cwd.
  # Point at the source checkout so its on-disk settings (device, band
  # cutoffs, smoothing) persist there instead of polluting this repo.
  working_dir: /Users/xandersteenbrugge/Documents/GitHub/Realtime_PyAudio_FFT
  osc_listen_host: 127.0.0.1
  osc_listen_port: 9000
  # The page looks for the server's WebSocket on 8765 unless told otherwise;
  # this Mac's server uses 8767 (configs/main.yaml `ws.port`; 8765 is taken).
  ui_url: http://127.0.0.1:8766/?ws_port=8767
  stale_after_s: 1.5
wzrd_input:
  # WZRD runs on this same Mac in dev, so the listener opens no port to the
  # network. The default (and the Pi) binds 0.0.0.0.
  listen_host: 127.0.0.1
agent:
  enabled: true
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  model: openai/gpt-6-luna
  fallback_models: [z-ai/glm-5.3-flash]  # tried in order if the model above is down
  reasoning_effort: medium  # none disables thinking entirely (faster); low/medium/high scale it up
  history_max_turns: 5
  request_timeout_seconds: 60.0
  rate_limit_per_minute: 10
  default_crossfade_seconds: 5.0
  api_key_env: OPENROUTER_API_KEY
  debug_logging: true
  retry_on_tool_error: 2
masters:
  brightness: 1.0
  speed: 1.0
  audio_reactivity: 1.0
  saturation: 1.0
