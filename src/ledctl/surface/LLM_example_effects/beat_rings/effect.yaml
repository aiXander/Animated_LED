name: beat_rings
summary: Each beat sends a soft ring out from the hub, the same distance on every
  leg; rings widen and fade, and a quiet one leaves by itself in silence.
source: agent
created_at: 1794853542.926852
updated_at: 1794854186.786551
params:
- key: palette
  label: Palette
  help: Each ring takes the next colour along it.
  control: palette
  default: sunset
- key: speed
  label: Speed
  help: 'Radius per second: 0.2 = a ring reaches the tips in five seconds.'
  control: slider
  min: 0.02
  max: 1.0
  step: 0.01
  default: 0.22
- key: width
  label: Ring width
  help: Width at the hub; a ring grows to three times that at the tips.
  control: slider
  min: 0.01
  max: 0.2
  step: 0.005
  default: 0.04
- key: reach
  label: Reach
  help: Where a ring has faded to nothing. 1 = the tips.
  control: slider
  min: 0.2
  max: 1.5
  step: 0.01
  default: 1.1
- key: brightness
  label: Brightness
  help: Brightness of a ring as it leaves the hub.
  control: slider
  min: 0.0
  max: 1.0
  step: 0.01
  default: 0.6
- key: idle_gap
  label: Idle gap
  help: With no beat for this long, a ring leaves anyway.
  control: slider
  min: 1.0
  max: 20.0
  step: 0.5
  default: 4.0
  unit: s
- key: colour_step
  label: Colour step
  help: How far along the palette each new ring moves.
  control: slider
  min: 0.0
  max: 0.5
  step: 0.01
  default: 0.13
param_values:
  palette: sunset
  speed: 0.22
  width: 0.04
  reach: 1.1
  brightness: 0.6
  idle_gap: 4.0
  colour_step: 0.13
