name: palette_wash_with_kick_sparkles
summary: Palette wash flowing out along the legs, breathing with the bass, plus sparkles
  on every kick. The canonical 'X plus Y' pattern.
source: bundled
created_at: 0
updated_at: 1794855910.941014
params:
- key: palette
  label: Wash palette
  control: palette
  default: warm
- key: wash_speed
  label: Wash speed
  help: Palette cycles per second, flowing outward.
  control: slider
  min: 0.0
  max: 2.0
  step: 0.01
  default: 0.05
  unit: cycles/s
- key: wash_repeats
  label: Wash repeats
  help: How many times the palette repeats over the legs.
  control: int_slider
  min: 1
  max: 6
  step: 1
  default: 1
- key: wash_level
  label: Wash brightness
  help: Brightness of the wash.
  control: slider
  min: 0.0
  max: 1.0
  step: 0.01
  default: 0.8
- key: bass_pump
  label: Bass pump
  help: How far the wash dims between bass hits. 0 = steady wash.
  control: slider
  min: 0.0
  max: 1.0
  step: 0.01
  default: 0.3
- key: sparkle_color
  label: Sparkle colour
  control: color
  default: '#ffffff'
- key: sparkle_count
  label: Sparkles per kick
  control: int_slider
  min: 0
  max: 80
  step: 1
  default: 12
- key: sparkle_decay
  label: Sparkle fade time
  control: slider
  min: 0.05
  max: 3.0
  step: 0.01
  default: 1.0
  unit: s
param_values:
  palette: warm
  wash_speed: 0.05
  wash_repeats: 1
  wash_level: 0.8
  bass_pump: 0.3
  sparkle_color: '#ffffff'
  sparkle_count: 12
  sparkle_decay: 1.0
